<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="referrer" content="strict-origin-when-cross-origin"/>
    <title>أفلام كرتون</title>
    <style>
/* Written for old Samsung TV browsers (Chromium 56 / Tizen 5.0):
   no CSS grid, flex gap, aspect-ratio, inset, clamp() or logical properties. */
:root{
    --bg:#070b16; --bg2:#0e1528; --card:#141d36; --card2:#1b2748; --line:rgba(255,255,255,.08);
    --txt:#eef2ff; --mut:#93a0c4; --acc:#2dd4bf; --acc2:#fbbf24; --red:#fb7185;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:calc(100vw / 105)}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(1200px 700px at 85% -10%,#16264d 0,transparent 60%),radial-gradient(900px 600px at 0% 110%,#0b3b3a 0,transparent 55%),#070b16;
    color:#eef2ff;font-family:"Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none;cursor:pointer}
svg{width:1.6rem;height:1.6rem;fill:currentColor;flex:none}
[hidden]{display:none!important}

#app{height:100%;display:flex;flex-direction:column;padding:1.4rem 2rem 1.2rem}

/* header */
#top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
#brand{display:flex;align-items:center}
#brand > div + div{margin-right:1rem}
#logo{width:4.2rem;height:4.2rem;flex:none}
#logo img{width:100%;height:100%;display:block}
#plTitle{font-size:1.9rem;font-weight:800}
#plSub{color:var(--mut);font-size:1rem;margin-top:.15rem}
#overall{display:flex;align-items:center;color:var(--mut);font-size:1rem}
#overall span{margin-left:.8rem}
.mini{width:14rem;height:.5rem;border-radius:1rem;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2dd4bf,#fbbf24);border-radius:1rem;transition:width .4s}

/* layout */
#main{flex:1;min-height:0;display:flex;flex-direction:row}
#left{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;margin-left:1.6rem}
#side{flex:none;width:31rem}
#box{position:relative;width:100%;background:#000;border-radius:1.2rem;overflow:hidden;box-shadow:0 1.2rem 3.5rem rgba(0,0,0,.55);flex:none}
#box::before{content:"";display:block;padding-top:56.25%}
#yt,#yt iframe{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border:0}
#poster{position:absolute;top:0;right:0;bottom:0;left:0;background:#000;transition:opacity .35s}
#poster img{width:100%;height:100%;object-fit:cover;opacity:.85}
#poster.gone{opacity:0;pointer-events:none}
#tap{position:absolute;top:0;right:0;bottom:0;left:0}
#spinner{position:absolute;top:50%;left:50%;width:4rem;height:4rem;margin:-2rem;border:.35rem solid rgba(255,255,255,.2);border-top-color:#2dd4bf;border-radius:50%;animation:spin .8s linear infinite;opacity:0;pointer-events:none;transition:opacity .2s}
#spinner.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
#bigPlay{position:absolute;top:50%;left:50%;width:6.2rem;height:6.2rem;margin:-3.1rem;border-radius:50%;background:rgba(45,212,191,.95);color:#04121a;display:flex;align-items:center;justify-content:center;box-shadow:0 .6rem 2.4rem rgba(0,0,0,.5);transition:transform .15s,opacity .2s}
#bigPlay svg{width:3.2rem;height:3.2rem;margin-right:-.2rem}
#bigPlay.hide{opacity:0;pointer-events:none}

/* overlay controls */
#overlay{position:absolute;right:0;bottom:0;left:0;padding:4rem 1.4rem 1rem;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .25s;display:flex;flex-direction:column}
#box:not(.ui-show) #overlay{opacity:0;pointer-events:none}
#box:not(.ui-show){cursor:none}
#ovTitle{font-size:1.25rem;font-weight:700;text-shadow:0 1px 6px #000}
#seek{position:relative;height:.5rem;margin:1.2rem .2rem .8rem;border-radius:1rem;background:rgba(255,255,255,.22);cursor:pointer}
#seek::before{content:"";position:absolute;top:-.8rem;bottom:-.8rem;left:0;right:0}
#buf,#fill{position:absolute;top:0;left:0;height:100%;border-radius:1rem;width:0}
#buf{background:rgba(255,255,255,.28)}
#fill{background:linear-gradient(90deg,#2dd4bf,#fbbf24)}
#knob{position:absolute;top:50%;width:1.1rem;height:1.1rem;margin:-.55rem 0 0 -.55rem;border-radius:50%;background:#fff;left:0;box-shadow:0 0 0 .2rem rgba(45,212,191,.5);transform:scale(.8);transition:transform .15s}
#seek:focus #knob,#seek:hover #knob{transform:scale(1.35)}
#bar{display:flex;justify-content:space-between;align-items:center}
.grp{display:flex;align-items:center}
.grp > * + *{margin-right:.4rem}
.ib{min-width:2.9rem;height:2.9rem;padding:0 .5rem;border-radius:.9rem;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s}
.ib span{font-size:.7rem;font-weight:700}
.ib.big{width:3.4rem;height:3.4rem;background:rgba(255,255,255,.14);border-radius:50%}
.ib:hover{background:rgba(255,255,255,.14)}
#time{font-size:1rem;color:#dbe4ff;margin:0 .8rem}
.chip{padding:.45rem 1rem;border-radius:2rem;background:rgba(255,255,255,.1);font-size:.95rem;color:#dbe4ff;transition:background .15s,transform .15s;white-space:nowrap}
.chip.on{background:#2dd4bf;color:#04121a;font-weight:700}
.chip:hover{background:rgba(255,255,255,.2)}
.chip.on:hover{background:#2dd4bf}
.btn{padding:.7rem 1.5rem;border-radius:.9rem;background:#2dd4bf;color:#04121a;font-weight:800;font-size:1.05rem}
.btn.ghost{background:rgba(255,255,255,.14);color:#eef2ff;font-weight:600;margin-right:.7rem}

/* focus */
.f:focus{outline:none}
body.kbd .f:focus{box-shadow:0 0 0 .22rem #fbbf24,0 0 1.4rem rgba(251,191,36,.45);transform:scale(1.05);z-index:3}
body.kbd #seek:focus{box-shadow:0 0 0 .2rem #fbbf24;transform:none}
body.kbd .row-item:focus{transform:scale(1.015)}
body.kbd #bigPlay:focus{transform:scale(1.1)}

/* error + upnext */
#err{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(5,8,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;z-index:5}
#err h3{font-size:1.6rem;color:#fb7185;margin-bottom:.9rem}
#err p{color:var(--mut);max-width:34rem;line-height:1.7;font-size:1.05rem;margin-bottom:.9rem}
#upnext{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(5,8,18,.9);display:flex;align-items:center;justify-content:center;padding:2rem;z-index:4}
#upImg{width:42%;height:auto;border-radius:1rem;box-shadow:0 .8rem 2rem rgba(0,0,0,.6);margin-left:1.4rem}
.upinfo{display:flex;flex-direction:column;max-width:42%}
.upinfo > * + *{margin-top:.8rem}
.upinfo small{color:var(--mut);font-size:1.05rem}
.upinfo b{color:#fbbf24;font-size:1.3rem}
.upinfo strong{font-size:1.5rem;line-height:1.4}
.row{display:flex}

/* now playing */
#info{padding:1rem .3rem 0}
#epBadge{display:inline-block;padding:.2rem .8rem;border-radius:2rem;background:rgba(251,191,36,.15);color:#fbbf24;font-weight:700;font-size:.95rem}
#nowTitle{font-size:1.6rem;margin-top:.45rem;line-height:1.35}
#nowMeta{color:var(--mut);margin-top:.3rem;font-size:1rem}

/* sidebar */
#side{display:flex;flex-direction:column;min-height:0;background:#101830;border:1px solid var(--line);border-radius:1.2rem;overflow:hidden}
#tools{padding:1rem 1rem .6rem;border-bottom:1px solid var(--line)}
#q{display:block;width:100%;padding:.75rem 1rem;border-radius:.9rem;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:1.05rem;cursor:text;margin-bottom:.7rem}
#q::placeholder{color:var(--mut)}
#chips{display:flex;flex-wrap:wrap}
#chips .chip{margin:0 0 .5rem .5rem}
#list{flex:1;overflow-y:auto;padding:.7rem}
#list::-webkit-scrollbar{width:.5rem}
#list::-webkit-scrollbar-thumb{background:#2a3a68;border-radius:1rem}
.row-item{display:flex;align-items:center;width:100%;margin-bottom:.55rem;padding:.5rem;border-radius:1rem;background:rgba(255,255,255,.04);border:1px solid transparent;text-align:right;transition:background .15s,transform .15s}
.row-item:hover{background:rgba(255,255,255,.09)}
.row-item.cur{background:linear-gradient(90deg,rgba(45,212,191,.2),rgba(45,212,191,.05));border-color:rgba(45,212,191,.5)}
.th{position:relative;width:9.4rem;flex:none;border-radius:.7rem;overflow:hidden;background:#0a1020;margin-left:.8rem}
.th::before{content:"";display:block;padding-top:56.25%}
.th img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.th em{position:absolute;bottom:.25rem;left:.25rem;font-style:normal;font-size:.75rem;padding:.05rem .4rem;border-radius:.3rem;background:rgba(0,0,0,.75);direction:ltr}
.th .pg{position:absolute;bottom:0;left:0;right:0;height:.28rem;background:rgba(255,255,255,.2)}
.th .pg i{display:block;height:100%;background:#fb7185}
.meta{flex:1;min-width:0}
.meta .n{font-size:.85rem;color:#fbbf24;font-weight:700}
.meta .t{font-size:1.05rem;line-height:1.35;max-height:2.8rem;overflow:hidden}
.row-item.done .t{color:var(--mut)}
.eq{display:none;align-items:flex-end;height:1.2rem;padding:0 .4rem}
.row-item.cur .eq{display:flex}
.eq i{display:block;width:.22rem;margin-left:.18rem;background:#2dd4bf;border-radius:.1rem;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(1){height:50%}.eq i:nth-child(2){height:100%;animation-delay:.2s}.eq i:nth-child(3){height:70%;animation-delay:.4s}
body.paused .eq i{animation-play-state:paused}
@keyframes eq{50%{transform:scaleY(.35)}}
.check{width:1.5rem;height:1.5rem;border-radius:50%;background:#2dd4bf;color:#04121a;display:none;align-items:center;justify-content:center;flex:none}
.check svg{width:1rem;height:1rem}
.row-item.done .check{display:flex}
.empty{padding:2rem;text-align:center;color:var(--mut)}

#toast{position:fixed;bottom:2rem;left:50%;transform:translate(-50%,2rem);background:#0b1224;border:1px solid var(--line);padding:.7rem 1.4rem;border-radius:2rem;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* theater (fullscreen) */
body.theater #app{padding:0}
body.theater #top,body.theater #side,body.theater #info{display:none}
body.theater #left{margin:0}
body.theater #box{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;border-radius:0;z-index:20}
body.theater #box::before{display:none}
body.theater #overlay{padding:6rem 3rem 1.6rem}

/* home (series shelf) */
#home{display:none;flex:1;min-height:0;overflow-y:auto}
body.home #home{display:block}
body.home #main,body.home #overall,body.home #homeBtn{display:none}
#homeBtn{margin-left:1rem}
#shelf{display:flex;flex-wrap:wrap;padding:1rem .5rem}
.series{width:30%;margin:0 1.5% 2rem;padding:.7rem;border-radius:1.4rem;background:#101830;border:1px solid var(--line);text-align:right;display:block;transition:transform .15s}
.series .im{position:relative;width:100%;border-radius:1rem;overflow:hidden;background:#000}
.series .im::before{content:"";display:block;padding-top:56.25%}
.series .im img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.series .sb{padding:.9rem .4rem .3rem}
.series h3{font-size:1.7rem}
.series p{color:var(--mut);font-size:1.05rem;margin:.3rem 0}
.series .cnt{color:#fbbf24;font-size:1rem;font-weight:700;margin-bottom:.6rem}
body.kbd .series:focus{box-shadow:0 0 0 .25rem #fbbf24,0 0 1.6rem rgba(251,191,36,.45);transform:scale(1.04)}

</style>
</head>

<script>
(function () {
    'use strict';

    var LIB = window.LIBRARY, P = null, items = [], inHome = true;
    function prep(list) {
        return list.map(function (it) {
            var sub = (it.name || it.title).replace(/^ينابيع المعرفة\s*/, '').replace(/^الحلقة\s*(\d+|الأولى)\s*(و\s*الأخيرة)?\s*\|?\s*/, '').trim();
            return { id: it.id, title: it.title, sub: sub, dur: it.dur, sec: it.sec, ep: it.ep, last: it.last };
        });
    }
    var $ = function (id) { return document.getElementById(id); };
    var KEY = 'yanabea.v1';

    /* ---------- persisted state ---------- */
    var S = { lastBy: {}, prog: {}, auto: true, rate: 1, desc: false, muted: false };
    try { var raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
    function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

    var cur = -1, yt = null, ready = false, filter = 'all', query = '';
    var hideTimer = null, upTimer = null, errTimer = null, pending = null, lastSave = 0;

    /* ---------- helpers ---------- */
    function fmt(s) {
        s = Math.max(0, Math.floor(s || 0));
        var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
        return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
    }
    function indexOfId(id) { for (var i = 0; i < items.length; i++) if (items[i].id === id) return i; return -1; }
    function epLabel(it) { return it.ep ? (it.last ? 'الحلقة ' + it.ep + ' (الأخيرة)' : 'الحلقة ' + it.ep) : 'فيديو'; }
    function shown(it) { return it.sub || (P ? P.title : it.title); }
    function thumb(id, q) { return 'https://i.ytimg.com/vi/' + id + '/' + (q || 'mqdefault') + '.jpg'; }
    var toastT;
    function toast(t) { var e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { e.classList.remove('on'); }, 1800); }
    function isDone(id) { var p = S.prog[id]; return !!(p && p.done); }

    /* ---------- header / list ---------- */

    function updateOverall() {
        var n = items.filter(function (i) { return isDone(i.id); }).length;
        $('overallTxt').textContent = 'شاهدت ' + n + ' من ' + items.length;
        $('overallFill').style.width = (n / items.length * 100) + '%';
    }

    function visibleIdx() {
        var arr = [];
        items.forEach(function (it, i) {
            if (filter === 'new' && isDone(it.id)) return;
            if (query) {
                var q = query.trim();
                if (/^\d+$/.test(q)) { if (String(it.ep) !== q && it.title.indexOf(q) < 0) return; }
                else if (it.title.indexOf(q) < 0) return;
            }
            arr.push(i);
        });
        if (S.desc) arr.reverse();
        return arr;
    }

    var CHECK = '<svg viewBox="0 0 24 24"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>';
    function renderList() {
        var list = $('list'), arr = visibleIdx(), html = '';
        if (!arr.length) { list.innerHTML = '<div class="empty">لا توجد نتائج</div>'; return; }
        arr.forEach(function (i) {
            var it = items[i], p = S.prog[it.id], pct = p && !p.done && p.d ? Math.min(100, p.t / p.d * 100) : 0;
            html += '<button class="row-item f' + (i === cur ? ' cur' : '') + (isDone(it.id) ? ' done' : '') + '" data-i="' + i + '" role="listitem">' +
                '<div class="th"><img loading="lazy" src="' + thumb(it.id) + '" alt=""/>' + (it.dur ? '<em>' + it.dur + '</em>' : '') +
                (pct ? '<div class="pg"><i style="width:' + pct + '%"></i></div>' : '') + '</div>' +
                '<div class="meta"><div class="n">' + epLabel(it) + '</div><div class="t">' + shown(it) + '</div></div>' +
                '<div class="eq"><i></i><i></i><i></i></div><div class="check">' + CHECK + '</div></button>';
        });
        list.innerHTML = html;
    }
    function refreshRow(i) {
        // cheap re-render keeping scroll
        var st = $('list').scrollTop; renderList(); $('list').scrollTop = st;
    }
    function scrollToCur() {
        var el = document.querySelector('.row-item.cur');
        if (el) $('list').scrollTop = el.offsetTop - $('list').clientHeight / 2 + el.offsetHeight / 2;
    }

    /* ---------- player ---------- */
    window.onYouTubeIframeAPIReady = function () {
        var vars = { controls: 0, disablekb: 1, fs: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, hl: 'ar', cc_lang_pref: 'ar' };
        if (/^https?:$/.test(location.protocol)) { vars.origin = location.origin; vars.widget_referrer = location.href; }
        yt = new YT.Player('yt', {
            width: '100%', height: '100%', playerVars: vars,
            events: { onReady: onReady, onStateChange: onState, onError: onError }
        });
    };
    function onReady() {
        ready = true;
        if (S.muted) yt.mute();
        syncMute();
        if (pending) { var p = pending; pending = null; load(p.i, p.autoplay); }
        setInterval(tick, 250);
    }

    function load(i, autoplay) {
        if (i < 0 || i >= items.length) return;
        cur = i;
        var it = items[i], p = S.prog[it.id];
        var start = p && !p.done && p.t > 5 && p.d && p.t < p.d - 10 ? Math.floor(p.t) : 0;
        S.lastBy[P.id] = it.id; save();
        clearTimeout(upTimer); clearTimeout(errTimer);
        $('upnext').hidden = true; $('err').hidden = true;
        $('posterImg').src = thumb(it.id, 'maxresdefault');
        $('posterImg').onerror = function () { this.onerror = null; this.src = thumb(it.id, 'hqdefault'); };
        $('poster').classList.remove('gone');
        $('nowTitle').textContent = shown(it);
        $('epBadge').textContent = epLabel(it);
        $('ovTitle').textContent = P.title + ' - ' + shown(it);
        $('nowMeta').textContent = (it.dur ? 'المدة ' + it.dur + ' • ' : '') + (start ? 'تابع من ' + fmt(start) + ' • ' : '') + (i + 1) + ' من ' + items.length;
        $('fill').style.width = '0'; $('knob').style.left = '0'; $('buf').style.width = '0';
        $('cur').textContent = fmt(start); $('dur').textContent = it.dur;
        document.title = it.title;
        renderList(); scrollToCur(); setPlayingUi(false);
        $('bigPlay').classList.remove('hide');
        if (!ready) { pending = { i: i, autoplay: autoplay }; return; }
        if (autoplay) { $('spinner').classList.add('on'); yt.loadVideoById({ videoId: it.id, startSeconds: start }); }
        else yt.cueVideoById({ videoId: it.id, startSeconds: start });
        try { yt.setPlaybackRate(S.rate); } catch (e) {}
    }

    function setPlayingUi(on) {
        $('icPlay').hidden = on; $('icPause').hidden = !on;
        document.body.classList.toggle('paused', !on);
        $('bigPlay').classList.toggle('hide', on);
        if (on) $('poster').classList.add('gone');
        showUi();
    }

    function onState(e) {
        var st = e.data, Y = YT.PlayerState;
        if (st === Y.PLAYING) { $('spinner').classList.remove('on'); setPlayingUi(true); try { yt.setPlaybackRate(S.rate); } catch (x) {} }
        else if (st === Y.PAUSED) { setPlayingUi(false); $('bigPlay').classList.add('hide'); saveProgress(true); }
        else if (st === Y.BUFFERING) { $('spinner').classList.add('on'); }
        else if (st === Y.CUED) { $('spinner').classList.remove('on'); }
        else if (st === Y.ENDED) { setPlayingUi(false); onEnded(); }
        if (st !== Y.BUFFERING && st !== Y.UNSTARTED) $('spinner').classList.remove('on');
    }

    function onEnded() {
        var it = items[cur];
        S.prog[it.id] = { t: 0, d: it.sec, done: true }; save();
        updateOverall(); refreshRow(cur);
        if (cur >= items.length - 1) { toast('انتهت جميع الحلقات 🎉'); $('poster').classList.remove('gone'); return; }
        if (!S.auto) { $('bigPlay').classList.remove('hide'); return; }
        showUpNext();
    }

    function showUpNext() {
        var n = items[cur + 1], c = 6;
        $('upImg').src = thumb(n.id, 'mqdefault'); $('upTitle').textContent = shown(n);
        $('upnext').hidden = false; $('upCount').textContent = c;
        setTimeout(function () { $('upNow').focus(); }, 0);
        (function step() {
            upTimer = setTimeout(function () {
                c--; $('upCount').textContent = c;
                if (c <= 0) { $('upnext').hidden = true; load(cur + 1, true); } else step();
            }, 1000);
        })();
    }
    function cancelUpNext() { clearTimeout(upTimer); $('upnext').hidden = true; $('bigPlay').classList.remove('hide'); $('bPlay').focus(); }

    function onError(e) {
        var code = e.data, msg, skip = false;
        if (code === 100 || code === 101 || code === 150) { msg = 'هذه الحلقة غير متاحة حالياً على يوتيوب.'; skip = true; }
        else if (code === 153 || code === 152) { msg = 'يوتيوب رفض التشغيل داخل التطبيق (خطأ ' + code + '). تأكد من اتصال الإنترنت ثم أعد المحاولة.'; }
        else msg = 'حدث خطأ أثناء تشغيل الفيديو (رمز ' + code + ').';
        $('spinner').classList.remove('on');
        $('errTitle').textContent = 'تعذّر تشغيل الحلقة';
        $('errMsg').textContent = msg + (skip && cur < items.length - 1 ? ' سيتم الانتقال للحلقة التالية.' : '');
        $('err').hidden = false;
        $('errNext').hidden = cur >= items.length - 1;
        $('errNext').focus();
        clearTimeout(errTimer);
        if (skip && cur < items.length - 1) errTimer = setTimeout(function () { load(cur + 1, true); }, 4000);
    }

    /* ---------- progress / ui tick ---------- */
    function tick() {
        if (!ready || !yt.getCurrentTime) return;
        var t = yt.getCurrentTime() || 0, d = yt.getDuration() || (items[cur] && items[cur].sec) || 0;
        if (!d) return;
        var pct = Math.min(100, t / d * 100);
        $('fill').style.width = pct + '%'; $('knob').style.left = pct + '%';
        $('buf').style.width = (yt.getVideoLoadedFraction() * 100) + '%';
        $('cur').textContent = fmt(t); $('dur').textContent = fmt(d);
        $('seek').setAttribute('aria-valuenow', Math.round(pct));
        if (yt.getPlayerState() === YT.PlayerState.PLAYING && Date.now() - lastSave > 5000) saveProgress();
    }
    function saveProgress(force) {
        if (!ready || cur < 0) return;
        var t = yt.getCurrentTime() || 0, d = yt.getDuration() || items[cur].sec;
        if (!d || t < 1) return;
        var it = items[cur], was = S.prog[it.id];
        var done = (was && was.done) || t > d - 20;
        S.prog[it.id] = { t: done ? 0 : t, d: d, done: done };
        lastSave = Date.now(); save();
        if (done && !(was && was.done)) { updateOverall(); refreshRow(cur); }
    }

    /* ---------- actions ---------- */
    function isPlaying() { return ready && yt.getPlayerState() === YT.PlayerState.PLAYING; }
    function toggle() {
        if (!ready || inHome) { return; }
        if (!$('upnext').hidden) { return; }
        var s = yt.getPlayerState();
        if (s === YT.PlayerState.PLAYING || s === YT.PlayerState.BUFFERING) yt.pauseVideo();
        else { $('poster').classList.add('gone'); yt.playVideo(); }
    }
    function seekBy(d) { if (!ready) return; var t = yt.getCurrentTime() + d; yt.seekTo(Math.max(0, Math.min(t, yt.getDuration() - 1)), true); showUi(); toast((d > 0 ? '+' : '−') + Math.abs(d) + ' ث'); }
    function next() { if (cur < items.length - 1) { saveProgress(); load(cur + 1, true); } else toast('هذه آخر حلقة'); }
    function prev() { if (ready && yt.getCurrentTime() > 5) { yt.seekTo(0, true); return; } if (cur > 0) { load(cur - 1, true); } else toast('هذه أول حلقة'); }
    function syncMute() { var m = ready && yt.isMuted(); $('icVol').hidden = m; $('icMute').hidden = !m; }
    function toggleMute() { if (!ready) return; if (yt.isMuted()) yt.unMute(); else yt.mute(); S.muted = yt.isMuted(); save(); syncMute(); }
    var RATES = [0.75, 1, 1.25, 1.5, 2];
    function cycleRate() { var i = RATES.indexOf(S.rate); S.rate = RATES[(i + 1) % RATES.length]; save(); if (ready) yt.setPlaybackRate(S.rate); syncChips(); toast('السرعة ' + S.rate + 'x'); }
    function syncChips() {
        $('bRate').textContent = S.rate + 'x';
        $('bAuto').classList.toggle('on', S.auto);
        $('bAuto').textContent = S.auto ? 'تلقائي: نعم' : 'تلقائي: لا';
        $('sortBtn').textContent = S.desc ? 'الأحدث أولاً' : 'الأقدم أولاً';
    }
    function theater(on) {
        if (on === undefined) on = !document.body.classList.contains('theater');
        document.body.classList.toggle('theater', on);
        try {
            if (on && document.documentElement.requestFullscreen && !/Tizen/i.test(navigator.userAgent)) document.documentElement.requestFullscreen();
            else if (!on && document.fullscreenElement) document.exitFullscreen();
        } catch (e) {}
        showUi(); setTimeout(function () { $('bPlay').focus(); }, 0);
    }
    function resume() {
        var i = S.lastBy[P.id] ? indexOfId(S.lastBy[P.id]) : -1;
        if (i < 0) i = 0;
        if (i !== cur) load(i, true); else toggle();
    }

    /* ---------- controls auto hide ---------- */
    function showUi() {
        $('box').classList.add('ui-show');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
            if (isPlaying() && !(document.activeElement && document.activeElement.id === 'q')) $('box').classList.remove('ui-show');
        }, 3800);
    }
    function uiHidden() { return !$('box').classList.contains('ui-show'); }

    /* ---------- events ---------- */
    $('tap').addEventListener('click', function () { showUi(); toggle(); });
    $('tap').addEventListener('dblclick', function () { theater(); });
    $('box').addEventListener('mousemove', showUi);
    $('bigPlay').addEventListener('click', toggle);
    $('bPlay').addEventListener('click', toggle);
    $('bNext').addEventListener('click', next);
    $('bPrev').addEventListener('click', prev);
    $('bBack').addEventListener('click', function () { seekBy(-10); });
    $('bFwd').addEventListener('click', function () { seekBy(10); });
    $('bMute').addEventListener('click', toggleMute);
    $('bRate').addEventListener('click', cycleRate);
    $('bTheater').addEventListener('click', function () { theater(); });
    $('bAuto').addEventListener('click', function () { S.auto = !S.auto; save(); syncChips(); });
    $('errNext').addEventListener('click', next);
    $('upNow').addEventListener('click', function () { clearTimeout(upTimer); $('upnext').hidden = true; load(cur + 1, true); });
    $('upCancel').addEventListener('click', cancelUpNext);
    $('resumeBtn').addEventListener('click', resume);
    $('sortBtn').addEventListener('click', function () { S.desc = !S.desc; save(); syncChips(); renderList(); scrollToCur(); });
    $('seek').addEventListener('click', function (e) {
        if (!ready) return;
        var r = this.getBoundingClientRect();
        yt.seekTo(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * yt.getDuration(), true);
        $('poster').classList.add('gone');
    });
    $('list').addEventListener('click', function (e) {
        var b = e.target.closest('.row-item'); if (!b) return;
        var i = +b.getAttribute('data-i');
        if (i === cur) { toggle(); } else { saveProgress(); load(i, true); }
    });
    document.querySelectorAll('[data-filter]').forEach(function (b) {
        b.addEventListener('click', function () {
            filter = b.getAttribute('data-filter');
            document.querySelectorAll('[data-filter]').forEach(function (x) { x.classList.toggle('on', x === b); });
            renderList();
        });
    });
    $('q').addEventListener('input', function () { query = this.value; renderList(); });
    document.addEventListener('fullscreenchange', function () {
        if (!document.fullscreenElement && document.body.classList.contains('theater')) document.body.classList.remove('theater');
    });
    window.addEventListener('beforeunload', function () { saveProgress(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) saveProgress(); });

    /* ---------- remote control / keyboard ---------- */
    try {
        ['MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop', 'MediaFastForward', 'MediaRewind', 'MediaTrackNext', 'MediaTrackPrevious'].forEach(function (k) { tizen.tvinputdevice.registerKey(k); });
    } catch (e) {}
    function exitApp() { try { tizen.application.getCurrentApplication().exit(); } catch (e) {} }

    function visible(el) { var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && !el.closest('[hidden]') && getComputedStyle(el).visibility !== 'hidden' && (!el.closest('#overlay') || !uiHidden()); }
    function navigate(dir) {
        var a = document.activeElement, scope = document;
        var cands = [].slice.call(document.querySelectorAll('.f')).filter(visible);
        if (!$('upnext').hidden) cands = cands.filter(function (e) { return e.closest('#upnext'); });
        else if (!$('err').hidden) cands = cands.filter(function (e) { return e.closest('#err'); });
        if (!a || !a.classList || !a.classList.contains('f') || cands.indexOf(a) < 0) { (cands.filter(function (e) { return e.id === 'bPlay'; })[0] || cands[0]).focus(); return; }
        var r = a.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, best = null, bs = 1e9;
        cands.forEach(function (el) {
            if (el === a) return;
            var b = el.getBoundingClientRect(), dx = b.left + b.width / 2 - cx, dy = b.top + b.height / 2 - cy, p, q;
            if (dir === 'left') { if (dx >= -2) return; p = -dx; q = Math.abs(dy); }
            else if (dir === 'right') { if (dx <= 2) return; p = dx; q = Math.abs(dy); }
            else if (dir === 'up') { if (dy >= -2) return; p = -dy; q = Math.abs(dx); }
            else { if (dy <= 2) return; p = dy; q = Math.abs(dx); }
            var s = p + q * 2.5;
            if (s < bs) { bs = s; best = el; }
        });
        if (best) {
            best.focus();
            if (best.closest('#list')) { var L = $('list'); L.scrollTop = best.offsetTop - L.clientHeight / 2 + best.offsetHeight / 2; }
            if (best.closest('#overlay')) showUi();
        }
    }

    document.addEventListener('mousemove', function () { document.body.classList.remove('kbd'); });
    document.addEventListener('keydown', function (e) {
        document.body.classList.add('kbd');
        var k = e.keyCode, typing = document.activeElement && document.activeElement.id === 'q';
        var inTheater = document.body.classList.contains('theater');
        var onSeek = document.activeElement && document.activeElement.id === 'seek';

        // Back / return
        if (k === 10009 || k === 27 || (k === 8 && !typing)) {
            e.preventDefault();
            if (!$('upnext').hidden) return cancelUpNext();
            if (typing) { $('q').blur(); return $('resumeBtn').focus(); }
            if (inTheater) return theater(false);
            if (!inHome) return goHome();
            return exitApp();
        }
        // Media keys
        if (k === 415 || k === 19 || k === 10252) { e.preventDefault(); return k === 415 ? (isPlaying() || toggle()) : k === 19 ? (isPlaying() && toggle()) : toggle(); }
        if (k === 417) { e.preventDefault(); return seekBy(30); }
        if (k === 412) { e.preventDefault(); return seekBy(-30); }
        if (k === 10233) { e.preventDefault(); return next(); }
        if (k === 10232) { e.preventDefault(); return prev(); }
        if (typing) { if (k === 40 || k === 38) { e.preventDefault(); $('q').blur(); navigate(k === 40 ? 'down' : 'up'); } return; }

        var dir = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' }[k];
        if (dir) {
            e.preventDefault();
            if (onSeek && (dir === 'left' || dir === 'right')) { seekBy(dir === 'right' ? 10 : -10); return; }
            if (inTheater && uiHidden() && (dir === 'left' || dir === 'right')) { seekBy(dir === 'right' ? 10 : -10); return; }
            if (inTheater && uiHidden()) { showUi(); return $('bPlay').focus(); }
            if (inTheater && !uiHidden()) showUi();
            return navigate(dir);
        }
        if (k === 13) {
            if (inHome) return;
            var a = document.activeElement;
            if (inTheater && uiHidden()) { e.preventDefault(); showUi(); return toggle(); }
            if (!a || a === document.body) { e.preventDefault(); return toggle(); }
            if (a.id === 'seek') { e.preventDefault(); return toggle(); }
            return; // buttons handle Enter natively
        }
        // desktop shortcuts
        var c = e.key;
        if (c === ' ' || c === 'k') { if (document.activeElement.tagName !== 'BUTTON') { e.preventDefault(); toggle(); } }
        else if (c === 'f') theater();
        else if (c === 'n') next();
        else if (c === 'p') prev();
        else if (c === 'm') toggleMute();
        else if (c === 'j') seekBy(-10);
        else if (c === 'l') seekBy(10);
    });

    /* ---------- home / series ---------- */
    function renderHome() {
        var html = '';
        LIB.forEach(function (pl, i) {
            var n = pl.items.filter(function (x) { return isDone(x.id); }).length, pct = pl.items.length ? n / pl.items.length * 100 : 0;
            var cover = pl.items.length ? thumb(pl.items[0].id, 'mqdefault') : (document.getElementById('logo').getElementsByTagName('img')[0].src);
            html += '<button class="series f" data-s="' + i + '"><div class="im"><img src="' + cover + '" alt=""/></div>' +
                '<div class="sb"><h3>' + pl.title + '</h3><p>' + pl.subtitle + '</p>' +
                '<div class="cnt">' + (pl.remote && !pl.loaded ? 'جارٍ التحميل...' : pl.items.length + (pl.remote ? ' فيديو' : ' حلقة')) + (n ? ' • شاهدت ' + n : '') + '</div>' +
                '<div class="mini"><i style="width:' + pct + '%"></i></div></div></button>';
        });
        $('shelf').innerHTML = html;
    }
    function enter(idx) {
        if (LIB[idx].remote && !LIB[idx].loaded) { toast('جارٍ تحميل القائمة، حاول بعد لحظات'); return; }
        if (!LIB[idx].items.length) { toast('لا توجد فيديوهات بعد'); return; }
        P = LIB[idx]; items = prep(P.items); inHome = false;
        document.body.classList.remove('home');
        filter = 'all'; query = ''; $('q').value = '';
        document.querySelectorAll('[data-filter]').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-filter') === 'all'); });
        $('plTitle').textContent = P.title;
        $('plSub').textContent = P.subtitle + ' • ' + items.length + ' حلقة';
        updateOverall(); renderList();
        var st = S.lastBy[P.id] ? indexOfId(S.lastBy[P.id]) : 0;
        load(st < 0 ? 0 : st, false);
        setTimeout(function () { $('bigPlay').focus(); }, 100);
    }
    function goHome() {
        saveProgress();
        clearTimeout(upTimer); clearTimeout(errTimer);
        $('upnext').hidden = true; $('err').hidden = true;
        try { if (ready) yt.stopVideo(); } catch (e) {}
        var back = P ? LIB.indexOf(P) : 0;
        inHome = true; cur = -1;
        document.body.classList.remove('theater');
        document.body.classList.add('home');
        $('plTitle').textContent = 'أفلام كرتون'; $('plSub').textContent = 'اختر المسلسل الذي تريد مشاهدته';
        document.title = 'أفلام كرتون';
        renderHome();
        var c = document.querySelector('[data-s="' + back + '"]'); if (c) c.focus();
    }
    $('shelf').addEventListener('click', function (e) {
        var b = e.target; while (b && b !== this && !b.getAttribute('data-s')) b = b.parentNode;
        if (b && b.getAttribute('data-s') !== null) enter(+b.getAttribute('data-s'));
    });
    $('homeBtn').addEventListener('click', goHome);

    /* ---------- remote series (managed from admin.html) ---------- */
    function loadRemote() {
        LIB.forEach(function (pl) {
            if (!pl.remote) return;
            var x = new XMLHttpRequest();
            x.open('GET', pl.remote + '?t=' + Date.now(), true);
            x.onreadystatechange = function () {
                if (x.readyState !== 4) return;
                try {
                    var d = JSON.parse(x.responseText);
                    pl.items = (d.items || []).map(function (v) {
                        return { id: v.id, title: v.title, name: v.title, ep: 0, last: false, dur: v.dur || '', sec: v.sec || 0 };
                    });
                    pl.loaded = true;
                } catch (e) { pl.items = []; pl.loaded = true; }
                if (inHome) { var f = document.activeElement && document.activeElement.getAttribute('data-s'); renderHome(); var c = document.querySelector('[data-s="' + (f || 0) + '"]'); if (c && f !== null) c.focus(); }
            };
            x.send();
        });
    }

    /* ---------- init ---------- */
    syncChips();
    document.body.classList.add('home');
    $('plTitle').textContent = 'أفلام كرتون'; $('plSub').textContent = 'اختر المسلسل الذي تريد مشاهدته';
    renderHome();
    loadRemote();
    setTimeout(function () { var c = document.querySelector('.series'); if (c) c.focus(); }, 300);
})();

</script>
<script src="https://www.youtube.com/iframe_api"></script>
